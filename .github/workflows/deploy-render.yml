name: Выкатить на Render

# Сервис создан через API, а не через панель, поэтому вебхука от GitHub у него
# нет и сам он новые коммиты не забирает. Проверено: три коммита подряд ушли
# в репозиторий, а на хостинге осталась старая версия.
#
# Эта задача заменяет вебхук: после каждого коммита в main просит Render
# выкатиться. Ключ лежит в секретах, id сервиса — в переменных репозитория.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-render
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Попросить Render выкатиться
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            # Хостинг ещё не подключён — это не поломка, просто ждём.
            echo "::notice::Нет RENDER_API_KEY или RENDER_SERVICE_ID — выкатывать некуда."
            exit 0
          fi

          code=$(curl -s -o /tmp/out.json -w '%{http_code}' \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}')

          if [ "$code" != "201" ]; then
            echo "::error::Render ответил HTTP $code"
            cat /tmp/out.json
            exit 1
          fi

          echo "деплой запрошен, Render соберёт образ сам"
