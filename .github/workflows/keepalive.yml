name: Будить радар

# Бесплатный Space засыпает после двух суток без обращений, а радару нужно
# работать всегда. Этот пинг раз в 15 минут держит его бодрым и заодно
# показывает в логах, если хостинг лёг.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Постучаться в радар
        env:
          SPACE_URL: ${{ vars.SPACE_URL }}
        run: |
          if [ -z "$SPACE_URL" ]; then
            # Хостинг ещё не подключён. Молча выходим: падающая задача раз в
            # 15 минут завалила бы владельца письмами о сбоях.
            echo "::notice::Хостинг ещё не настроен (нет переменной SPACE_URL) — будить нечего."
            exit 0
          fi

          # первый запрос после сна поднимает контейнер и может быть долгим
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "${SPACE_URL%/}/healthz" || echo 000)
            if [ "$code" = "200" ]; then
              echo "радар отвечает (попытка $attempt)"
              exit 0
            fi
            echo "попытка $attempt: HTTP $code, жду 20 с"
            sleep 20
          done

          echo "::error::Радар не ответил за 6 попыток — загляни в логи Space"
          exit 1
