name: Выкатить на Hugging Face

# Каждое изменение кода уезжает на бесплатный хостинг, где радар работает
# круглосуточно. Space пересобирает контейнер сам, как только получит коммит.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить, что Space настроен
        id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            # Хостинг ещё не подключён — это не поломка, просто ждём.
            # Падать тут нельзя: GitHub начнёт слать письма о сбоях.
            echo "::notice::Хостинг ещё не настроен (нет HF_TOKEN или HF_SPACE) — выкатывать некуда."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Собрать дерево для Space
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p /tmp/space
          # всё, кроме служебного: сам git и настройки CI на хостинге не нужны
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            ./ /tmp/space/
          # HF ждёт Dockerfile и README с описанием Space в корне
          cp infra/deploy/Dockerfile          /tmp/space/Dockerfile
          cp infra/deploy/hf-space-README.md  /tmp/space/README.md

      - name: Отправить в Space
        if: steps.check.outputs.skip != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd /tmp/space
          git init -q -b main
          git config user.name  "tma-radar bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "деплой из ${GITHUB_SHA::7}"
          # история Space нам не нужна, поэтому каждый раз ровно один коммит
          git push -q --force \
            "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "готово: https://huggingface.co/spaces/${HF_SPACE}"
