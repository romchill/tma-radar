name: Будить радар

# Бесплатный сервис Render засыпает после 15 минут без ВХОДЯЩИХ запросов,
# а радару нужно работать всегда: собственное исходящее соединение с Telegram
# сном не считается. Пинг раз в 10 минут держит сервис бодрым и заодно
# показывает в логах, если хостинг лёг.
#
# Бесплатно дают 750 часов в месяц, в месяце их около 730 — круглосуточная
# работа одного сервиса влезает с запасом часов в двадцать. Второй бесплатный
# сервис уже не влезет — они делят один и тот же запас.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Постучаться в радар
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            # Хостинг ещё не подключён. Молча выходим: падающая задача раз в
            # десять минут завалила бы владельца письмами о сбоях.
            echo "::notice::Хостинг ещё не настроен (нет переменной APP_URL) — будить нечего."
            exit 0
          fi

          # первый запрос после сна поднимает контейнер и может быть долгим
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "${APP_URL%/}/healthz" || echo 000)
            if [ "$code" = "200" ]; then
              echo "радар отвечает (попытка $attempt)"
              exit 0
            fi
            echo "попытка $attempt: HTTP $code, жду 20 с"
            sleep 20
          done

          echo "::error::Радар не ответил за 6 попыток — загляни в логи хостинга"
          exit 1
